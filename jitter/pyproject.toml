[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Primary distribution name. Note: 'jitter' is taken on PyPI.
# Proposed alternatives: 'jitter-ml' (selected), 'jitterbench', 'jitter-latency'.
name = "jitter-ml"
version = "0.1.0"
description = "Root-cause analysis tool for on-device ML latency"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ayush Dubey", email = "ayushdubey3740@gmail.com" }
]
keywords = ["machine-learning", "latency", "benchmark", "android", "tflite", "onnx", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.15.0",
]
tflite = [
    "ai-edge-litert>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "jsonschema>=4.21.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
jitter = "jitter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jitter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "hypothesis.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src"]
